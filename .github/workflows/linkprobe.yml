name: linkprobe
on: [push, workflow_dispatch]
jobs:
  prove:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Install JS deps
        run: npm install --no-audit --no-fund
      - name: Prebuild (plugin copies the bridge + adds the package)
        run: npx expo prebuild --platform ios --no-install
      - name: Assert the bridge + package reached the APP project
        run: |
          grep -q "CoreML-LLM" ios/*.xcodeproj/project.pbxproj || { echo "NO package ref in app project"; exit 1; }
          grep -q "YKCoreMLBridge.swift" ios/*.xcodeproj/project.pbxproj || { echo "NO bridge in app project"; exit 1; }
          test -f ios/linkprobe/YKCoreMLBridge.swift || { echo "bridge file not copied"; exit 1; }
          echo "bridge + package present in app project"
      - name: Pod install
        run: cd ios && pod install
      - name: Unsigned build — the tripwire must compile
        run: |
          set -o pipefail
          cd ios
          xcodebuild -workspace linkprobe.xcworkspace -scheme linkprobe \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > full.log 2>&1 || {
              echo '=== ERRORS ==='
              grep -E "error:" full.log | sort | uniq -c | sort -rn | head -40
              exit 65
            }
          echo TRIPWIRE COMPILED
          echo '--- did the bridge actually compile? ---'
          grep -c "YKCoreMLBridge.swift" full.log || true
          grep "YKCoreMLBridge" full.log | head -4 || true
      - name: Assert the bridge class is IN the binary
        run: |
          BIN=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products*iphoneos*/linkprobe.app/linkprobe" | head -1)
          test -n "$BIN" || { echo "no built binary found"; find ~/Library/Developer/Xcode/DerivedData -name "linkprobe.app" | head -3; exit 1; }
          echo "binary: $BIN"; ls -la "$(dirname "$BIN")" | head -8
          echo '--- objc classes in binary ---'
          nm "$BIN" 2>/dev/null | grep -i "objc_class" | head -6 || true
          echo '--- object files carrying the bridge ---'
          find ~/Library/Developer/Xcode/DerivedData -name "*.o" -path "*linkprobe*" 2>/dev/null | xargs grep -l "YKCoreMLBridge" 2>/dev/null | head -4 || true
          (strings "$BIN" | grep -q "YKCoreMLBridge") || (nm "$BIN" 2>/dev/null | grep -qi "ykcoreml") || { echo "class missing from binary"; exit 1; }
          echo "THE LINK IS REAL — class present in binary"
